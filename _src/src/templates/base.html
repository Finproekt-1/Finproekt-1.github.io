<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }}</title>
<meta name="description" content="{{ page.description }}">
<link rel="canonical" href="{{ site.url }}{{ page.path }}">
<meta name="robots" content="{{ page.robots or 'index, follow' }}">
<meta name="yandex-verification" content="{{ site.yandex_verification }}">
<meta property="og:type" content="{{ page.og_type or 'website' }}">
<meta property="og:locale" content="ru_RU">
<meta property="og:site_name" content="{{ site.name }}">
<meta property="og:title" content="{{ page.title }}">
<meta property="og:description" content="{{ page.description }}">
<meta property="og:url" content="{{ site.url }}{{ page.path }}">
<meta property="og:image" content="{{ site.url }}{{ page.image or site.og_image }}">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.ico">
<link rel="alternate" type="application/rss+xml" title="ФинПроект-1 — Блог" href="{{ site.url }}/rss.xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/base.css?v={{ ver }}">
<link rel="stylesheet" href="/css/custom.css?v={{ ver }}">
{% for ld in page.jsonld %}<script type="application/ld+json">{{ ld | tojson }}</script>
{% endfor %}
</head>
<body>
{{ header }}
<main>
{{ content }}
</main>
{{ footer }}
{% include 'dialogs.html' %}
{% include 'chat.html' %}
<div data-mbar class="fp-mbar" aria-label="Быстрая связь"><button type="button" data-open="quiz">Бесплатная консультация</button><a href="{{ site.telegram }}" target="_blank" rel="noopener noreferrer">{{ icon('send','h-4 w-4') }}Telegram</a></div>
<div data-toast class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-[100] rounded-lg border border-border bg-background px-4 py-3 text-sm shadow-lg"></div>
<script>window.FP={supabase:"{{ site.backend.supabase_url }}",key:"{{ site.backend.anon_key }}",chat:"{{ site.backend.chat_url }}",quiz:{{ site.quiz | tojson }}};</script>
<script src="/js/site.js?v={{ ver }}" defer></script>
<script>(function(m,e,t,r,i,k,a){m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};m[i].l=1*new Date();for(var j=0;j<document.scripts.length;j++){if(document.scripts[j].src===r){return;}}k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)})(window,document,"script","https://mc.yandex.ru/metrika/tag.js","ym");ym({{ site.metrika }},"init",{clickmap:true,trackLinks:true,accurateTrackBounce:true,webvisor:true});</script>
<noscript><div><img src="https://mc.yandex.ru/watch/{{ site.metrika }}" style="position:absolute;left:-9999px" alt=""></div></noscript>
</body>
</html>
